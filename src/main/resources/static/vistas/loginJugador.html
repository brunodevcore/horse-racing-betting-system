<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso Jugador</title>
  <style>
    :root{
      --white: #ffffff;
      --topbar: #1e3a5f;
      --accent: #1e3a5f;
      --text: #333333;
      --muted-border: #e6e9ee;
      --card-shadow: rgba(0,0,0,0.06);
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--white);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      background: var(--white);
      border: 1px solid var(--muted-border);
      border-radius: 8px;
      box-shadow: 0 6px 18px var(--card-shadow);
      padding: 36px;
      width: 100%;
      max-width: 480px;
    }

    .login-card h1 {
      margin: 0 0 20px 0;
      font-size: 1.5rem;
      color: var(--topbar);
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--muted-border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
      background: #ffffff;
      color: var(--text);
    }

    .button-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .button-primary:hover {
      opacity: 0.95;
    }

    .message {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 6px;
      display: none;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }

    @media (max-width: 520px){
      .login-card{ padding: 24px; margin: 16px; }
      .login-card h1{ font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Ingreso Jugador</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="nombreUsuario">Nombre de usuario</label>
        <input id="nombreUsuario" name="nombreUsuario" type="text" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" required autocomplete="current-password" />
      </div>
      <button id="loginButton" type="button" class="button-primary">Ingresar</button>
    </form>
    <div id="message" class="message" role="alert"></div>
  </main>

  <script type="module">
    import { CommandDispatcher } from './CommandDispatcher.js';

    const form = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const messageEl = document.getElementById('message');

    function showMessage(text) {
      if (!text) {
        messageEl.style.display = 'none';
        messageEl.textContent = '';
        return;
      }
      messageEl.textContent = text;
      messageEl.className = 'message error';
      messageEl.style.display = 'block';
    }

    CommandDispatcher.mapFunctions({
      redirigir: (parametro) => {
        if (typeof parametro === 'string' && parametro.trim()) {
          window.location.href = parametro;
        }
      },
      error: (parametro) => {
        showMessage(typeof parametro === 'string' ? parametro : 'Ocurrió un error');
      }
    });

    loginButton.addEventListener('click', () => {
      showMessage('');

      const formData = new FormData(form);
      const payload = {
        nombreUsuario: formData.get('nombreUsuario'),
        contrasena: formData.get('contrasena')
      };

      CommandDispatcher.submit('/loginJugador', payload);
    });
  </script>
</body>
</html>
