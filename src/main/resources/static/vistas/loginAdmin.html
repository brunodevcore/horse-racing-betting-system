<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrador Hipódromo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }
    .login-card h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .button-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .button-primary:hover {
      background: #1d4ed8;
    }
    .message {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 6px;
      display: none;
    }
    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Ingreso Administrador</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="nombreUsuario">Nombre de usuario</label>
        <input id="nombreUsuario" name="nombreUsuario" type="text" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" required autocomplete="current-password" />
      </div>
      <button id="loginButton" type="button" class="button-primary">Ingresar</button>
    </form>
    <div id="message" class="message" role="alert"></div>
  </main>

  <script type="module">
    import { CommandDispatcher } from './CommandDispatcher.js';

    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('message');

    function showMessage(text) {
      if (!text) {
        messageEl.style.display = 'none';
        messageEl.textContent = '';
        return;
      }
      messageEl.textContent = text;
      messageEl.className = 'message error';
      messageEl.style.display = 'block';
    }

    CommandDispatcher.mapFunctions({
      redirigir: (parametro) => {
        if (typeof parametro === 'string' && parametro.trim()) {
          window.location.href = parametro;
        }
      },
      error: (parametro) => {
        showMessage(typeof parametro === 'string' ? parametro : 'Ocurrió un error');
      }
    });

    const loginButton = document.getElementById('loginButton');

    loginButton.addEventListener('click', () => {
      showMessage('');

      const formData = new FormData(form);
      const payload = {
        nombreUsuario: formData.get('nombreUsuario'),
        contrasena: formData.get('contrasena')
      };

      CommandDispatcher.submit('/loginAdmin', payload);
    });
  </script>
</body>
</html>
