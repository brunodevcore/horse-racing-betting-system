<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Control - MalaPata</title>
        <style>
            :root{
                --white: #ffffff;
                --topbar: #1e3a5f; /* azul oscuro */
                --accent: #1e3a5f;
                --text: #333333;
                --muted-border: #e6e9ee;
                --card-shadow: rgba(0,0,0,0.06);
                --number-blue: #1e3a5f;
            }

            html, body { height: 100%; }
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: var(--white);
                color: var(--text);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                padding-top: 64px; /* espacio para la barra superior */
            }

            /* Barra superior fija */
            h1 {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 64px;
                margin: 0;
                display: flex;
                align-items: center;
                padding: 0 24px;
                background: var(--topbar);
                color: #ffffff;
                font-size: 1.25rem;
                font-weight: 700;
                z-index: 1000;
                box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            }

            /* Contenido centrado */
            body > div, main, section {
                max-width: 1200px;
                margin: 18px auto;
                padding: 16px;
                background: var(--white);
                border: 1px solid var(--muted-border);
                border-radius: 6px;
                box-shadow: 0 6px 18px var(--card-shadow);
            }

            /* Mensajes de error */
            #errorMessage{ color: #b00020; padding: 8px 12px; border-radius: 6px; }

            p { margin: 6px 0; color: var(--text); }
            strong { color: var(--text); }

            /* Métricas en tarjetas: convertimos los <p> del bloque de métricas en tarjetas */
            body > div:nth-of-type(4) {
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
            }

            body > div:nth-of-type(4) p {
                background: var(--white);
                border: 1px solid var(--muted-border);
                box-shadow: 0 6px 18px var(--card-shadow);
                padding: 14px 16px;
                border-radius: 8px;
                min-width: 160px;
                flex: 1 1 180px;
            }

            body > div:nth-of-type(4) p span { display: block; font-size: 1.6rem; color: var(--number-blue); font-weight: 700; }

            /* Secciones con fondo blanco y borde gris claro (ya aplicado a body > div) */
            h2 { color: var(--topbar); margin-top: 0; }

            /* Botones Gestionar */
            button{
                background: var(--accent);
                color: #ffffff;
                border: none;
                padding: 8px 12px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 700;
            }

            button:hover{
                opacity: 0.95;
                transform: translateY(-1px);
            }

            /* Carreras contenedores */
            #carrerasFinalizadasContainer > div, #proximasCarrerasContainer > div{
                padding: 10px 12px;
                margin: 8px 0;
                background: var(--white);
                border: 1px solid var(--muted-border);
                border-radius: 6px;
            }

            /* Tablas: borde sutil */
            table{ width:100%; border-collapse: collapse; margin-top: 8px; }
            thead th{ background: #f8fafc; color: var(--text); padding: 10px 12px; text-align: left; font-weight: 700; border-bottom: 1px solid var(--muted-border); }
            tbody td{ padding: 10px 12px; border-bottom: 1px solid #f1f4f8; color: var(--text); }

            @media (max-width: 900px){ body > div, main, section{ margin: 12px; padding: 12px; } button{ margin:6px 4px 0 0; } }
        </style>
</head>
<body>
    <h1>Tablero de Control - MalaPata</h1>
    
    <div id="errorMessage"></div>

    <div>
        <p>Administrador: <strong id="nombreAdmin">Cargando...</strong></p>
    </div>

    <div>
        <p>Fecha de la Jornada: <span id="jornadaFecha">-</span></p>
        <button id="btnAnterior">Jornada Anterior</button>
        <button id="btnSiguiente">Jornada Siguiente</button>
    </div>

    <div>
        <p>Total de Carreras: <span id="cantidadCarreras">0</span></p>
        <p>Carreras Finalizadas: <span id="cantidadFinalizadas">0</span></p>
        <p>Carreras por Correr: <span id="cantidadFaltanCorrer">0</span></p>
    
        <p>Total Apostado: $<span id="totalApostado">0</span></p>
        <p>Total Pagado: $<span id="totalPagado">0</span></p>
        <p>Total Comisiones: $<span id="totalComisiones">0</span></p>
        <p>Balance: $<span id="balance">0</span></p>
    
    </div>

    <div>
        <h2>Carreras Finalizadas</h2>
        <div id="carrerasFinalizadasContainer"></div>
    </div>

    <div>
        <h2>Próximas Carreras</h2>
        <div id="proximasCarrerasContainer"></div>
    </div>

    <script type="module">
        import dispatcher from '/vistas/CommandDispatcher.js';
        import SSECommandDispatcher from '/vistas/SSECommandDispatcher.js';

        // Registrar la vista
        const view = dispatcher.registerView('TableroAdmin', {
            urlInicio: '/admin/inicializarVista'
        });

        // Registrar handlers para los comandos
        view.handler('nombreAdmin', (data) => {
            document.getElementById('nombreAdmin').textContent = data;
        });

        view.handler('jornada', (data) => {
            document.getElementById('jornadaFecha').textContent = data.fecha || '-';
            document.getElementById('cantidadCarreras').textContent = data.cantidadCarreras || 0;
            document.getElementById('cantidadFinalizadas').textContent = data.cantidadCarrerasFinalizadas || 0;
            document.getElementById('cantidadFaltanCorrer').textContent = data.cantidadCarrerasProximas || 0;

            document.getElementById('totalApostado').textContent = data.totalApostado || 0;
            document.getElementById('totalPagado').textContent = data.totalPagado || 0;
            document.getElementById('totalComisiones').textContent = data.totalComisiones || 0;
            document.getElementById('balance').textContent = data.balance || 0; 

            renderCarrerasFinalizadas(data.carrerasFinalizadas || []);
            renderProximasCarreras(data.proximasCarreras || []);
            clearError();
        });

        view.handler('error', (data) => {
            showError(data);
        });

        // Funciones para renderizar carreras
        function renderCarrerasFinalizadas(carreras) {
            const container = document.getElementById('carrerasFinalizadasContainer');
            
            if (!carreras || carreras.length === 0) {
                container.innerHTML = '<p>No hay carreras finalizadas</p>';
                return;
            }

            container.innerHTML = carreras.map(carrera => `
                <div>
                    <h3>${carrera.nombre} (Carrera #${carrera.numero})</h3>
                    <p>Estado: ${carrera.estado}</p>
                    <p>Caballos: ${carrera.cantidadCaballos}</p>
                    <p>Ganador: ${carrera.nombreGanador || 'N/A'}</p>
                </div>
            `).join('');
        }

        function renderProximasCarreras(carreras) {
            const container = document.getElementById('proximasCarrerasContainer');
            
            if (!carreras || carreras.length === 0) {
                container.innerHTML = '<p>No hay próximas carreras</p>';
                return;
            }

            container.innerHTML = carreras.map(carrera => `
                <div>
                    <h3>${carrera.nombre} (Carrera #${carrera.numero})</h3>
                    <p>Estado: ${carrera.estado}</p>
                    <p>Caballos: ${carrera.cantidadCaballos}</p>
                    <button onclick="gestionar(${carrera.numero})">Gestionar</button>
                </div>
            `).join('');
        }

        // Funciones para manejar errores
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Error: ' + message;
        }

        function clearError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '';
        }

        // Event listeners para los botones
        document.getElementById('btnAnterior').addEventListener('click', () => {
            dispatcher.submit('/admin/jornada/anterior', {});
        });

        document.getElementById('btnSiguiente').addEventListener('click', () => {
            dispatcher.submit('/admin/jornada/siguiente', {});
        });

        window.gestionar = function(numeroCarrera) {
            sessionStorage.setItem('numeroCarrera', numeroCarrera);
            window.location.href = '/vistas/gestionCarrera.html';
        }


        // Iniciar la vista al cargar
        window.addEventListener('load', () => {dispatcher.startView(view);
        new SSECommandDispatcher('/admin/registrarSSE', dispatcher);
        });
    </script>
</body>
</html>
