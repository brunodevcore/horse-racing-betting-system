<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Carrera - MalaPata</title>
</head>
<body>
    <h1>Gestión de Carrera - MalaPata</h1>
    
    <div id="errorMessage"></div>

    <div>
        <h2>Información de la Carrera</h2>
        <p>Número: <span id="carreraNumero">-</span></p>
        <p>Nombre: <span id="carreraNombre">-</span></p>
        <p>Estado: <span id="carreraEstado">-</span></p>
        <p>Cantidad de Caballos: <span id="cantidadCaballos">-</span></p>
        <p>Ganador: <span id="nombreGanador">-</span></p>
    </div>

    <div>
        <h2>Caballos Participantes</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Nombre Caballo</th>
                    <th>Dividendo</th>
                    <th>Total Apostado</th>
                    <th>Cantidad de Apuestas</th>
                </tr>
            </thead>
            <tbody id="participacionesContainer">
                <tr>
                    <td colspan="5">Cargando participaciones...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div>
        <h2>Acciones de Gestión</h2>
        <button id="btnAbrirCarrera" type="button">Abrir Carrera</button>
        <button id="btnCerrarCarrera" type="button">Cerrar Carrera</button>
        <div style="margin-top: 12px;">
            <label for="selectGanador">Caballo ganador:</label>
            <select id="selectGanador">
                <option value="">Seleccione un caballo</option>
            </select>
            <button id="btnFinalizarCarrera" type="button">Finalizar Carrera</button>
        </div>
    </div>

    <script type="module">
        import dispatcher from '/vistas/CommandDispatcher.js';
        import SSECommandDispatcher from '/vistas/SSECommandDispatcher.js';

        // Registrar la vista
        const numeroCarrera = sessionStorage.getItem('numeroCarrera');

        const view = dispatcher.registerView('GestionCarrera', {
            urlInicio: '/gestionCarrera/inicializarVista',
            dataInicio: { numeroCarrera: numeroCarrera }
            
        });
        console.log('numeroCarrera:', numeroCarrera);

        // Registrar handler para el comando carrera
        view.handler('carrera', (data) => {
            document.getElementById('carreraNumero').textContent = data.numero || '-';
            document.getElementById('carreraNombre').textContent = data.nombre || '-';
            document.getElementById('carreraEstado').textContent = data.estado || '-';
            document.getElementById('cantidadCaballos').textContent = data.cantidadCaballos || '-';
            document.getElementById('nombreGanador').textContent = data.nombreGanador || 'Aún no hay ganador';

            renderParticipaciones(data.participaciones || []);
            clearError();
        });

        // Registrar handler para el comando error
        view.handler('error', (data) => {
            showError(data);
        });

        view.handler('redirigir', (url) => {
                window.location.href = '/vistas/' + url;  
        });

        // Función para renderizar la tabla de participaciones
        function renderParticipaciones(participaciones) {
            const container = document.getElementById('participacionesContainer');
            const selectGanador = document.getElementById('selectGanador');
            
            if (!participaciones || participaciones.length === 0) {
                container.innerHTML = '<tr><td colspan="5">No hay participaciones registradas</td></tr>';
                selectGanador.innerHTML = '<option value="">Seleccione un caballo</option>';
                return;
            }

            container.innerHTML = participaciones.map(participacion => `
                <tr>
                    <td>${participacion.numero || '-'}</td>
                    <td>${participacion.nombreCaballo || '-'}</td>
                    <td>${participacion.dividendo || '-'}</td>
                    <td>${participacion.totalApostado || 0}</td>
                    <td>${participacion.cantidadApuestas || 0}</td>
                </tr>
            `).join('');

            selectGanador.innerHTML = [
                '<option value="">Seleccione un caballo</option>',
                ...participaciones.map(participacion => `
                    <option value="${participacion.numero}">${participacion.numero} - ${participacion.nombreCaballo}</option>
                `)
            ].join('');
        }

        // Funciones para manejar errores
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Error: ' + message;
        }

        function clearError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '';
        }

        // Botones de gestión
        document.getElementById('btnAbrirCarrera').addEventListener('click', () => {
            dispatcher.submit('/gestionCarrera/abrir', {});
        });

        document.getElementById('btnCerrarCarrera').addEventListener('click', () => {
            dispatcher.submit('/gestionCarrera/cerrar', {});
        });

        document.getElementById('btnFinalizarCarrera').addEventListener('click', () => {
            const selectGanador = document.getElementById('selectGanador');
            const numeroParticipacion = parseInt(selectGanador.value, 10);
            if (!numeroParticipacion) {
                showError('Debe seleccionar un caballo ganador para finalizar la carrera.');
                return;
            }
            dispatcher.submit('/gestionCarrera/finalizar', { numeroParticipacion });
        });

        // Iniciar la vista al cargar
        window.addEventListener('load', () => { dispatcher.startView(view);
            new SSECommandDispatcher('/gestionCarrera/registrarSSE', dispatcher);
        });
    </script>
</body>
</html>
